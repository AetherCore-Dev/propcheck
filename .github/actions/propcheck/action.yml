name: "propcheck"
description: "Run AI-powered property-based testing on every PR"
author: "AetherCore-Dev"

branding:
  icon: "shield"
  color: "green"

inputs:
  target:
    description: "Target file or directory to test"
    required: false
    default: "."
  mode:
    description: "Run mode: quick, default, thorough"
    required: false
    default: "default"
  version:
    description: "propcheck version to install (default: latest)"
    required: false
    default: "latest"

outputs:
  passed:
    description: "Number of properties that passed"
    value: ${{ steps.run.outputs.passed }}
  failed:
    description: "Number of properties that failed"
    value: ${{ steps.run.outputs.failed }}
  total:
    description: "Total properties tested"
    value: ${{ steps.run.outputs.total }}

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install propcheck
      shell: bash
      run: npm install -g "propcheck@${{ inputs.version }}" fast-check

    - name: Run propcheck
      id: run
      shell: bash
      run: |
        TARGET="${{ inputs.target }}"
        MODE="${{ inputs.mode }}"

        if [ "$MODE" = "quick" ]; then
          OUTPUT=$(propcheck run --quick --json "$TARGET" 2>&1) || true
        elif [ "$MODE" = "thorough" ]; then
          OUTPUT=$(propcheck run --thorough --json "$TARGET" 2>&1) || true
        else
          OUTPUT=$(propcheck run --json "$TARGET" 2>&1) || true
        fi

        PASSED=$(echo "$OUTPUT" | grep -o '"status":"passed"' | wc -l || echo 0)
        FAILED=$(echo "$OUTPUT" | grep -o '"status":"failed"' | wc -l || echo 0)
        TOTAL=$((PASSED + FAILED))

        echo "passed=$PASSED" >> $GITHUB_OUTPUT
        echo "failed=$FAILED" >> $GITHUB_OUTPUT
        echo "total=$TOTAL" >> $GITHUB_OUTPUT

        # Also run human-readable output for logs
        if [ "$MODE" = "quick" ]; then
          propcheck run --quick "$TARGET"
        elif [ "$MODE" = "thorough" ]; then
          propcheck run --thorough "$TARGET"
        else
          propcheck run "$TARGET"
        fi
