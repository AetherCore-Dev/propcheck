name: "propcheck"
description: "Run AI-powered property-based testing on every PR"
author: "AetherCore-Dev"

branding:
  icon: "shield"
  color: "green"

inputs:
  target:
    description: "Target file or directory to test"
    required: false
    default: "."
  mode:
    description: "Run mode: quick, default, thorough"
    required: false
    default: "default"
  version:
    description: "propcheck version to install (default: latest)"
    required: false
    default: "latest"

outputs:
  passed:
    description: "Number of properties that passed"
    value: ${{ steps.run.outputs.passed }}
  failed:
    description: "Number of properties that failed"
    value: ${{ steps.run.outputs.failed }}
  total:
    description: "Total properties tested"
    value: ${{ steps.run.outputs.total }}

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install propcheck
      shell: bash
      env:
        PROPCHECK_VERSION: ${{ inputs.version }}
      run: npm install -g "propcheck@${PROPCHECK_VERSION}" fast-check typescript

    - name: Run propcheck
      id: run
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        MODE: ${{ inputs.mode }}
      run: |
        MODE_FLAG=""
        case "$MODE" in
          quick)    MODE_FLAG="--quick" ;;
          thorough) MODE_FLAG="--thorough" ;;
          *)        MODE_FLAG="" ;;
        esac

        # Single run with JSON output
        RESULT_FILE=$(mktemp /tmp/propcheck-run-XXXXXX.json)
        propcheck run $MODE_FLAG --json "$TARGET" > "$RESULT_FILE" 2>&1 || true

        # Parse with node (no python dependency)
        COUNTS=$(node -e "
          const fs = require('fs');
          try {
            const data = JSON.parse(fs.readFileSync('${RESULT_FILE}', 'utf8'));
            const s = data.summary || {};
            console.log([s.passed||0, s.failed||0].join(' '));
          } catch { console.log('0 0'); }
        " 2>/dev/null || echo "0 0")

        read -r PASSED FAILED <<< "$COUNTS"
        TOTAL=$((PASSED + FAILED))

        echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
        echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
        echo "total=$TOTAL" >> "$GITHUB_OUTPUT"

        # Print human-readable summary from the same JSON
        node -e "
          const fs = require('fs');
          try {
            const d = JSON.parse(fs.readFileSync('${RESULT_FILE}', 'utf8'));
            const s = d.summary || {};
            console.log('propcheck: ' + (s.passed||0) + ' passed, ' + (s.failed||0) + ' failed, ' + (s.errors||0) + ' errors');
            for (const f of (d.failed || [])) {
              console.log('  FAIL ' + f.propertyId + ': ' + (f.errorMessage||'').slice(0,200));
            }
          } catch {}
        " 2>/dev/null || true

        rm -f "$RESULT_FILE"
