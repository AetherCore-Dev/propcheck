name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install npm dependencies
        run: npm install

      - name: Run lint
        run: npm run lint

  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18, 20, 22]
        exclude:
          - os: macos-latest
            node-version: 18
          - os: windows-latest
            node-version: 18

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install hypothesis pytest

      - name: Install npm dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Run compiled tests
        run: npm run test:ci

      - name: CLI smoke test (dev build)
        shell: bash
        run: |
          node packages/cli/dist/index.js --version
          node packages/cli/dist/index.js init
          node packages/cli/dist/index.js infer --mock test-fixtures/typescript/sort-utils.ts
          node packages/cli/dist/index.js run --quick test-fixtures/typescript/sort-utils.ts

      - name: Bundle smoke test (published artifact)
        shell: bash
        run: |
          cd packages/cli && npx tsup 2>&1 | tail -3
          cd ../..
          node packages/cli/dist-bundle/index.js --version
          node packages/cli/dist-bundle/index.js init
          node packages/cli/dist-bundle/index.js infer --mock test-fixtures/typescript/sort-utils.ts
          node packages/cli/dist-bundle/index.js run --quick test-fixtures/typescript/sort-utils.ts

  coverage:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install hypothesis pytest

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30
