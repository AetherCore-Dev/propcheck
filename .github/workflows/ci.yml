name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18, 20, 22]
        exclude:
          - os: macos-latest
            node-version: 18
          - os: windows-latest
            node-version: 18

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install hypothesis pytest

      - name: Install npm dependencies
        run: npm install

      - name: Build
        run: npx tsc --build

      - name: Run unit tests
        shell: bash
        run: |
          node --test \
            packages/parser/dist/__tests__/parser.test.js \
            packages/store/dist/__tests__/store.test.js \
            packages/store/dist/__tests__/store-edge.test.js \
            packages/common/dist/__tests__/assertion-sanitizer.test.js \
            packages/common/dist/__tests__/git.test.js \
            packages/config/dist/__tests__/config.test.js \
            packages/reporter/dist/__tests__/reporter.test.js \
            packages/llm/dist/__tests__/llm.test.js \
            packages/llm/dist/__tests__/scoring-edge.test.js \
            packages/llm/dist/__tests__/response-parser-edge.test.js \
            packages/llm/dist/__tests__/adaptive-generator.test.js \
            packages/llm/dist/__tests__/mock-fix.test.js \
            packages/llm/dist/__tests__/mock-refinement.test.js \
            packages/engines/dist/__tests__/fc-codegen.test.js \
            packages/engines/dist/__tests__/hyp-codegen.test.js \
            packages/engines/dist/__tests__/result-parser.test.js \
            packages/engines/dist/__tests__/fc-runner.test.js \
            packages/cli/dist/__tests__/commands.test.js \
            packages/cli/dist/__tests__/auto-weaken.test.js \
            packages/cli/dist/__tests__/init.test.js \
            packages/cli/dist/__tests__/confirm.test.js \
            packages/cli/dist/__tests__/fix.test.js

      - name: Run E2E tests
        run: node --test packages/engines/dist/__tests__/e2e.test.js

      - name: CLI smoke test (dev build)
        shell: bash
        run: |
          node packages/cli/dist/index.js --version
          node packages/cli/dist/index.js init
          node packages/cli/dist/index.js infer --mock test-fixtures/typescript/sort-utils.ts
          node packages/cli/dist/index.js run --quick test-fixtures/typescript/sort-utils.ts

      - name: Bundle smoke test (published artifact)
        shell: bash
        run: |
          cd packages/cli && npx tsup 2>&1 | tail -3
          cd ../..
          node packages/cli/dist-bundle/index.js --version
          node packages/cli/dist-bundle/index.js init
          node packages/cli/dist-bundle/index.js infer --mock test-fixtures/typescript/sort-utils.ts
          node packages/cli/dist-bundle/index.js run --quick test-fixtures/typescript/sort-utils.ts

  coverage:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npx tsc --build

      - name: Run tests with c8 coverage
        run: |
          npx c8 \
            --reporter=text --reporter=lcov \
            --include='packages/*/dist/**/*.js' \
            --exclude='packages/*/dist/__tests__/**' \
            --exclude='packages/cli/dist-bundle/**' \
            node --test \
              packages/parser/dist/__tests__/parser.test.js \
              packages/store/dist/__tests__/store.test.js \
              packages/store/dist/__tests__/store-edge.test.js \
              packages/common/dist/__tests__/assertion-sanitizer.test.js \
              packages/common/dist/__tests__/git.test.js \
              packages/config/dist/__tests__/config.test.js \
              packages/reporter/dist/__tests__/reporter.test.js \
              packages/llm/dist/__tests__/llm.test.js \
              packages/llm/dist/__tests__/scoring-edge.test.js \
              packages/llm/dist/__tests__/response-parser-edge.test.js \
              packages/llm/dist/__tests__/adaptive-generator.test.js \
              packages/llm/dist/__tests__/mock-fix.test.js \
              packages/llm/dist/__tests__/mock-refinement.test.js \
              packages/engines/dist/__tests__/fc-codegen.test.js \
              packages/engines/dist/__tests__/hyp-codegen.test.js \
              packages/engines/dist/__tests__/result-parser.test.js \
              packages/engines/dist/__tests__/fc-runner.test.js \
              packages/cli/dist/__tests__/commands.test.js \
              packages/cli/dist/__tests__/auto-weaken.test.js \
              packages/cli/dist/__tests__/init.test.js \
              packages/cli/dist/__tests__/confirm.test.js \
              packages/cli/dist/__tests__/fix.test.js

      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30
