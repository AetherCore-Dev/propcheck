name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18, 20, 22]
        exclude:
          - os: macos-latest
            node-version: 18
          - os: windows-latest
            node-version: 18

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install hypothesis pytest

      - name: Install npm dependencies
        run: npm install

      - name: Install fast-check
        run: npm install fast-check

      - name: Build
        run: npx tsc --build

      - name: Run unit tests
        run: |
          node --test packages/parser/dist/__tests__/parser.test.js
          node --test packages/store/dist/__tests__/store.test.js
          node --test packages/llm/dist/__tests__/llm.test.js
          node --test packages/engines/dist/__tests__/fc-codegen.test.js

      - name: Run E2E tests
        run: node --test packages/engines/dist/__tests__/e2e.test.js

      - name: CLI smoke test
        run: |
          node packages/cli/dist/index.js --version
          node packages/cli/dist/index.js init
          node packages/cli/dist/index.js infer --mock test-fixtures/typescript/cart-buggy.ts
          node packages/cli/dist/index.js run --quick test-fixtures/typescript/cart-buggy.ts || true
          node packages/cli/dist/index.js infer --mock test-fixtures/typescript/sort-utils.ts
          node packages/cli/dist/index.js run --quick test-fixtures/typescript/sort-utils.ts
          node packages/cli/dist/index.js badge
