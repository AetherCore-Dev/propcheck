name: propcheck PR Review

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

jobs:
  propcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          npm install
          npm install fast-check
          npx tsc --build

      - name: Infer properties (mock mode for demo)
        run: |
          node packages/cli/dist/index.js init
          # Infer properties for all TypeScript fixtures
          for f in test-fixtures/typescript/*.ts; do
            node packages/cli/dist/index.js infer --mock "$f" 2>&1 || true
          done

      - name: Run propcheck and capture results
        id: propcheck
        run: |
          # Run all and capture JSON output
          RESULTS=""
          EXIT=0
          for f in test-fixtures/typescript/*.ts; do
            OUTPUT=$(node packages/cli/dist/index.js run --json "$f" 2>&1) || EXIT=1
            RESULTS="${RESULTS}${OUTPUT}\n"
          done

          # Also capture human-readable output
          HUMAN=""
          for f in test-fixtures/typescript/*.ts; do
            OUTPUT=$(node packages/cli/dist/index.js run --quick "$f" 2>&1) || true
            HUMAN="${HUMAN}${OUTPUT}\n"
          done

          # Write to file for the comment step
          echo "$HUMAN" > /tmp/propcheck-output.txt

          # Parse summary counts from JSON
          PASSED=$(echo -e "$RESULTS" | grep -o '"status":"passed"' | wc -l || echo 0)
          FAILED=$(echo -e "$RESULTS" | grep -o '"status":"failed"' | wc -l || echo 0)
          ERRORS=$(echo -e "$RESULTS" | grep -o '"status":"error"' | wc -l || echo 0)
          TOTAL=$((PASSED + FAILED + ERRORS))

          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "errors=$ERRORS" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "exit_code=$EXIT" >> $GITHUB_OUTPUT

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('/tmp/propcheck-output.txt', 'utf8');
            const passed = '${{ steps.propcheck.outputs.passed }}';
            const failed = '${{ steps.propcheck.outputs.failed }}';
            const errors = '${{ steps.propcheck.outputs.errors }}';
            const total = '${{ steps.propcheck.outputs.total }}';

            const status = failed > 0 ? '❌' : '✅';
            const summary = failed > 0
              ? `Found **${failed} property violation(s)**`
              : `All **${passed} properties** passed`;

            const body = `## ${status} propcheck — ${summary}

            | Metric | Count |
            |--------|-------|
            | Properties tested | ${total} |
            | ✅ Passed | ${passed} |
            | ❌ Failed | ${failed} |
            | ⚠️ Errors | ${errors} |

            <details>
            <summary>Full output</summary>

            \`\`\`
            ${output.trim().slice(0, 3000)}
            \`\`\`

            </details>

            ---
            > 🔍 Powered by [propcheck](https://github.com/AetherCore-Dev/propcheck) — AI property-based testing
            > Install: \`npx propcheck init && npx propcheck infer src/ && npx propcheck run\``;

            // Find existing propcheck comment to update (avoid spam)
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('propcheck')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if properties violated
        if: steps.propcheck.outputs.failed > 0
        run: exit 1
