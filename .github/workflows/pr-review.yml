name: propcheck PR Review

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

jobs:
  propcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for git diff

      - name: Run propcheck on changed files
        uses: ./.github/actions/propcheck-comment
        with:
          mode: quick
          mock: "true"
          comment: "true"
          fail-on-violation: "true"
          # For real LLM mode, uncomment:
          # mock: "false"
          # api-key: ${{ secrets.PROPCHECK_API_KEY }}
